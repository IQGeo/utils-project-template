# nginx TLS sidecar for keeping Keycloak PRIVATE in Codespaces.
#
# Terminates TLS with a self-signed cert (generated at container start) and
# reverse-proxies to the internal keycloak:8080. The app server's server-side
# OIDC discovery hits this nginx via the Docker network alias for the external
# Keycloak hostname, so no public port is needed. X-Forwarded-* headers let
# Keycloak (KC_PROXY=edge) build correct absolute URLs.
server {
    listen 443 ssl;

    ssl_certificate     /tmp/cert.pem;
    ssl_certificate_key /tmp/key.pem;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
